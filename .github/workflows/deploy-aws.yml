name: Deploy Scoutline to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: scoutline-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::243413538293:role/ScoutlineGitHubDeployRole
          aws-region: us-east-1
      - name: Recover failed initial stack
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name scoutline-production --region us-east-1 --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo MISSING)
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STATUS" = "ROLLBACK_FAILED" ]; then
            echo "Deleting failed initial stack before clean recreation"
            aws cloudformation delete-stack --stack-name scoutline-production --region us-east-1
            aws cloudformation wait stack-delete-complete --stack-name scoutline-production --region us-east-1
          fi
      - name: Deploy AWS infrastructure
        run: |
          if ! aws cloudformation deploy \
            --template-file aws-hosting/template.yml \
            --stack-name scoutline-production \
            --region us-east-1 \
            --role-arn arn:aws:iam::243413538293:role/ScoutlineCloudFormationExecutionRole \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset; then
            aws cloudformation describe-stack-events \
              --stack-name scoutline-production \
              --region us-east-1 \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output table || true
            exit 1
          fi
      - name: Read deployment outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name scoutline-production --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          TABLE_NAME=$(aws cloudformation describe-stacks --stack-name scoutline-production --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='TableName'].OutputValue" --output text)
          APP_ID=$(aws cloudformation describe-stacks --stack-name scoutline-production --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='AmplifyAppId'].OutputValue" --output text)
          SITE_URL=$(aws cloudformation describe-stacks --stack-name scoutline-production --region us-east-1 --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "TABLE_NAME=$TABLE_NAME" >> "$GITHUB_ENV"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
      - name: Validate source-backed catalog
        run: node aws-hosting/scripts/validate-data.mjs
      - name: Seed verified scam database
        run: node aws-hosting/scripts/seed.mjs
      - name: Build static site bundle
        run: |
          cp -R aws-hosting/site aws-hosting/build
          printf '{"apiUrl":"%s"}\n' "$API_URL" > aws-hosting/build/config.json
          cd aws-hosting/build
          zip -qr ../site.zip .
      - name: Publish to Amplify
        run: |
          DEPLOYMENT=$(aws amplify create-deployment --app-id "$APP_ID" --branch-name main --region us-east-1)
          JOB_ID=$(echo "$DEPLOYMENT" | jq -r .jobId)
          UPLOAD_URL=$(echo "$DEPLOYMENT" | jq -r .zipUploadUrl)
          curl --fail --silent --show-error -T aws-hosting/site.zip "$UPLOAD_URL"
          aws amplify start-deployment --app-id "$APP_ID" --branch-name main --job-id "$JOB_ID" --region us-east-1
          for ATTEMPT in $(seq 1 60); do
            STATUS=$(aws amplify get-job --app-id "$APP_ID" --branch-name main --job-id "$JOB_ID" --region us-east-1 --query job.summary.status --output text)
            echo "Amplify deployment: $STATUS"
            if [ "$STATUS" = "SUCCEED" ]; then exit 0; fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then exit 1; fi
            sleep 10
          done
          exit 1
      - name: Verify production
        run: |
          curl --fail --retry 10 --retry-delay 5 "$SITE_URL/"
          curl --fail --retry 10 --retry-delay 5 "$API_URL/scams"
          echo "Scoutline is live at $SITE_URL"
