AWSTemplateFormatVersion: "2010-09-09"
Description: Scoutline public site, API, and verified scam database

Resources:
  ScamTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: scoutline-scams
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  CandidateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: scoutline-ingestion-candidates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: candidateId
          AttributeType: S
      KeySchema:
        - AttributeName: candidateId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  IngestionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScoutlineIngestionRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource:
                  - !GetAtt CandidateTable.Arn
                  - !GetAtt ScamTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/scoutline-source-ingestion:*

  SourceIngestionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: scoutline-source-ingestion
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt IngestionRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          CANDIDATE_TABLE: !Ref CandidateTable
          SCAM_TABLE: !Ref ScamTable
      Code:
        ZipFile: |
          import hashlib, html, json, os, re, time
          from datetime import datetime, timezone
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen
          import boto3

          table = boto3.resource("dynamodb").Table(os.environ["CANDIDATE_TABLE"])
          scams = boto3.resource("dynamodb").Table(os.environ["SCAM_TABLE"])
          official = [
            ("Federal Trade Commission", "https://consumer.ftc.gov/consumer-alerts", 1),
            ("FBI Internet Crime Complaint Center", "https://www.ic3.gov/PSA", 1),
            ("U.S. Postal Inspection Service", "https://www.uspis.gov/news?filters=scam-article", 1),
            ("Internal Revenue Service", "https://www.irs.gov/newsroom/tax-scams-consumer-alerts", 1),
            ("Social Security Administration OIG", "https://oig.ssa.gov/scam-alerts/index.html", 1),
            ("HHS Office of Inspector General", "https://oig.hhs.gov/fraud/consumer-alerts/", 1),
            ("SEC Investor.gov", "https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-alerts", 1),
            ("Better Business Bureau", "https://www.bbb.org/all/scamstudies", 2),
            ("Virginia Attorney General", "https://www.oag.state.va.us/consumer-protection/consumer-alerts", 2),
            ("New York Attorney General", "https://ag.ny.gov/resources/individuals/consumer-issues/scams", 2),
            ("California Attorney General", "https://oag.ca.gov/consumers/general/scams", 2),
          ]
          community = [
            ("Community", "https://www.reddit.com/r/Scams/new/.rss", 3),
          ]
          keywords = re.compile(r"scam|fraud|phish|impersonat|identity|ransom|extort|decept|theft|fake|counterfeit", re.I)
          stopwords = {"this","that","with","from","have","been","they","what","when","where","your","scam","scams","fraud","warning","alert"}

          def fetch(url):
            req = Request(url, headers={"User-Agent":"ScoutlineSafetyResearch/1.0 (+https://github.com/Jrjoseph831/scoutline)"})
            with urlopen(req, timeout=20) as response:
              return response.read(2000000).decode("utf-8", "replace")

          def links(body, base):
            found = []
            for href, raw in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', body, re.I | re.S):
              title = html.unescape(re.sub(r"<[^>]+>", " ", raw))
              title = re.sub(r"\s+", " ", title).strip()
              url = urljoin(base, html.unescape(href))
              if title and len(title) >= 12 and url.startswith("https://") and keywords.search(title + " " + url):
                found.append((title[:300], url[:1000]))
            return found[:100]

          def tokens(title):
            return {word for word in re.findall(r"[a-z0-9]+", title.lower()) if len(word) >= 4 and word not in stopwords}

          def official_match(title, official_items):
            community_tokens = tokens(title)
            best, best_score, shared = None, 0, 0
            for item in official_items:
              official_tokens = tokens(item["title"])
              overlap = len(community_tokens & official_tokens)
              union = len(community_tokens | official_tokens) or 1
              score = overlap / union
              if overlap >= 3 and score > best_score:
                best, best_score, shared = item, score, overlap
            return (best, best_score) if best and best_score >= 0.45 and shared >= 3 else (None, 0)

          def save(publisher, index_url, tier, source_type, title, url, now, official_items):
            canonical = url.split("#", 1)[0]
            candidate_id = hashlib.sha256(canonical.encode()).hexdigest()
            verified = source_type == "official"
            match, match_score = official_match(title, official_items) if not verified else (None, 0)
            candidate = {
              "candidateId": candidate_id,
              "title": title,
              "sourceUrl": canonical,
              "sourceIndexUrl": index_url,
              "sourcePublisher": publisher if verified else "Community",
              "sourceType": source_type,
              "sourceTier": tier,
              "verificationState": "official-source-candidate" if verified else ("corroborated-by-official" if match else "community-reported-unverified"),
              "publicationState": "held-for-enrichment" if verified else "published",
              "publicEligible": not verified,
              "firstObservedAt": now,
              "lastObservedAt": now,
              "expiresAt": now + (15552000 if verified else 2592000),
            }
            if match:
              candidate.update({
                "resolutionMethod": "conservative-title-token-match",
                "resolutionScore": str(round(match_score, 3)),
                "resolvedSourcePublisher": match["publisher"],
                "resolvedSourceUrl": match["url"],
                "resolvedAt": now
              })
            table.put_item(Item=candidate)
            if not verified:
              day = datetime.fromtimestamp(now, timezone.utc).strftime("%Y-%m-%d")
              corroborated = bool(match)
              scams.put_item(Item={
                "slug": "community-" + candidate_id[:20],
                "title": title,
                "summary": ("A community-reported pattern matches an alert from " + match["publisher"] + ". Review the official source before acting.") if corroborated else "Community members are reporting this possible scam pattern. It has not yet been corroborated by an established source.",
                "category": "community-report",
                "channels": ["community"],
                "impersonates": "See the matched official alert" if corroborated else "Unverified",
                "warningSigns": [
                  "The pattern was first observed through a community report",
                  "Confirm that your situation matches the official alert"
                ] if corroborated else ["This report has not been independently confirmed", "Details may be incomplete, mistaken, or change quickly"],
                "actionSteps": [
                  "Do not send money or personal information",
                  "Search the confirmed guides for a matching pattern",
                  "Verify any claimed organization through a contact method you already trust"
                ],
                "responseScript": "I am going to verify this independently before responding.",
                "severity": "medium",
                "confidence": "corroborated" if corroborated else "community-reported-unverified",
                "status": "active" if corroborated else "unverified",
                "firstSeen": day,
                "lastSeen": day,
                "sourceCount": 2 if corroborated else 1,
                "lastVerifiedAt": datetime.fromtimestamp(now, timezone.utc).isoformat(),
                "scope": "national",
                "state": None,
                "city": None,
                "postalCode": None,
                "sourcePublisher": match["publisher"] if corroborated else "Community",
                "sourceUrl": match["url"] if corroborated else "",
                "sourcePublishedAt": datetime.fromtimestamp(now, timezone.utc).isoformat(),
                "expiresAt": now + 2592000
              })

          def handler(event, context):
            now, saved, failures, official_items = int(time.time()), 0, [], []
            for publisher, index_url, tier in official:
              try:
                for title, url in links(fetch(index_url), index_url):
                  official_items.append({"title": title, "url": url, "publisher": publisher})
                  save(publisher, index_url, tier, "official", title, url, now, official_items)
                  saved += 1
              except Exception as error:
                failures.append({"source": publisher, "error": str(error)[:200]})
            for publisher, index_url, tier in community:
              try:
                for title, url in links(fetch(index_url), index_url):
                  save(publisher, index_url, tier, "community", title, url, now, official_items)
                  saved += 1
              except Exception as error:
                failures.append({"source": publisher, "error": str(error)[:200]})
            print(json.dumps({"saved": saved, "officialCandidates": len(official_items), "failures": failures}))
            return {"saved": saved, "officialCandidates": len(official_items), "failures": failures}

  IngestionSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: scoutline-source-ingestion-every-six-hours
      ScheduleExpression: rate(6 hours)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SourceIngestionFunction.Arn
          Id: ScoutlineSourceIngestion

  IngestionSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SourceIngestionFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IngestionSchedule.Arn

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScoutlineApiRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Scan]
                Resource: !GetAtt ScamTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/scoutline-public-api:*

  ScamApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: scoutline-public-api
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref ScamTable
      Code:
        ZipFile: |
          const { DynamoDBClient, ScanCommand, GetItemCommand } = require("@aws-sdk/client-dynamodb");
          const { unmarshall } = require("@aws-sdk/util-dynamodb");
          const db = new DynamoDBClient({});
          const reply = (statusCode, body) => ({
            statusCode,
            headers: {
              "content-type": "application/json",
              "access-control-allow-origin": "*",
              "cache-control": "public, max-age=300"
            },
            body: JSON.stringify(body)
          });
          exports.handler = async (event) => {
            try {
              const slug = event.pathParameters && event.pathParameters.slug;
              if (slug) {
                const result = await db.send(new GetItemCommand({
                  TableName: process.env.TABLE_NAME,
                  Key: { slug: { S: slug } }
                }));
                return result.Item ? reply(200, { item: unmarshall(result.Item) }) : reply(404, { error: "Not found" });
              }
              const query = ((event.queryStringParameters || {}).q || "").toLowerCase().slice(0, 120);
              const category = ((event.queryStringParameters || {}).category || "all").toLowerCase();
              const result = await db.send(new ScanCommand({ TableName: process.env.TABLE_NAME }));
              const items = (result.Items || []).map(unmarshall).filter((item) => {
                const haystack = `${item.title} ${item.summary} ${item.category} ${item.impersonates || ""}`.toLowerCase();
                return (!query || haystack.includes(query)) && (category === "all" || item.category === category);
              }).sort((a, b) => String(b.lastSeen).localeCompare(String(a.lastSeen)));
              return reply(200, { items, meta: { count: items.length, dataStatus: "source-backed", generatedAt: new Date().toISOString() } });
            } catch (error) {
              console.error(error);
              return reply(500, { items: [], error: "Service unavailable" });
            }
          };

  ScamApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: scoutline-public-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: [content-type]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ScamApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ScamApiFunction.Arn
      PayloadFormatVersion: "2.0"

  ListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ScamApi
      RouteKey: GET /scams
      Target: !Sub integrations/${ApiIntegration}

  DetailRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ScamApi
      RouteKey: GET /scams/{slug}
      Target: !Sub integrations/${ApiIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ScamApi
      StageName: "$default"
      AutoDeploy: true

  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ScamApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ScamApi}/*

  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: scoutline
      Platform: WEB
      EnableBranchAutoDeletion: true
      CustomRules:
        - { Source: /library, Target: /library/index.html, Status: "200" }
        - { Source: /toolkit, Target: /toolkit/index.html, Status: "200" }
        - { Source: /how-it-works, Target: /how-it-works/index.html, Status: "200" }
        - { Source: /organizations, Target: /organizations/index.html, Status: "200" }
        - { Source: /support, Target: /support/index.html, Status: "200" }

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: main
      EnableAutoBuild: false
      Stage: PRODUCTION

  DeploymentRuntimePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ScoutlineDeploymentRuntime
      Roles:
        - ScoutlineGitHubDeployRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SeedVerifiedScamData
            Effect: Allow
            Action: dynamodb:BatchWriteItem
            Resource: !GetAtt ScamTable.Arn
          - Sid: PublishScoutlineToAmplify
            Effect: Allow
            Action:
              - amplify:CreateDeployment
              - amplify:StartDeployment
              - amplify:GetJob
            Resource: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyApp.AppId}*
          - Sid: RunScoutlineIngestion
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt SourceIngestionFunction.Arn

Outputs:
  ApiUrl:
    Value: !Sub https://${ScamApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  TableName:
    Value: !Ref ScamTable
  CandidateTableName:
    Value: !Ref CandidateTable
  IngestionFunctionName:
    Value: !Ref SourceIngestionFunction
  AmplifyAppId:
    Value: !GetAtt AmplifyApp.AppId
  SiteUrl:
    Value: !Sub https://main.${AmplifyApp.DefaultDomain}
